; FlightScnr CYD - firmware for the 4.0" 320x480 "Cheap Yellow Display"
; (ESP32-32E / ESP32-WROOM-32E, ST7796S SPI LCD, XPT2046 resistive touch),
; sold as LCDWiki E32R40T and many unbranded clones.
;
;   pio run                  build
;   pio run -t upload        flash over USB (or use the web installer)
;   pio device monitor       serial log (115200)

[platformio]
default_envs = cyd-e32r40t

[env:cyd-e32r40t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/version.py
build_unflags = -Os
build_flags =
  -O2
  -Iinclude
  -Isrc
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DARDUINOJSON_ENABLE_PROGMEM=0
  -DARDUINOJSON_USE_DOUBLE=1
  -Wno-missing-field-initializers
lib_deps =
  lovyan03/LovyanGFX@1.2.32
  lvgl/lvgl@8.4.0
  bblanchon/ArduinoJson@7.4.3
