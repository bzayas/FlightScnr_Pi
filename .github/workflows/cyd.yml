#
# FlightScnr CYD (cyd/): build the ESP32 firmware, run the simulator and the
# installer<->firmware schema check, and publish the web installer to GitHub
# Pages. This never creates a GitHub Release: the Pi's updater reads this
# repo's releases, so CYD builds ship through Pages and workflow artifacts.
#
# Pages deploys on manual runs, or on pushes to main once the repository
# variable CYD_PAGES is set to "on" (Settings -> Pages -> Source: GitHub Actions).

name: CYD firmware & installer

on:
  push:
    branches: [main]
    tags: ["cyd-v*"]
    paths: ["cyd/**", ".github/workflows/cyd.yml"]
  pull_request:
    paths: ["cyd/**", ".github/workflows/cyd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyd/firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('cyd/firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Check VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/cyd-v')
        run: |
          WANT="cyd-v$(tr -d '[:space:]' < ../VERSION)"
          if [ "$WANT" != "$GITHUB_REF_NAME" ]; then
            echo "cyd/VERSION says $WANT but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Portal assets are up to date
        run: python3 tools/build_portal.py --check

      - name: Build firmware
        run: pio run -e cyd-e32r40t

      - name: Installer and firmware agree on the settings format
        run: make -C sim check

      - name: HTTP/HTTPS client host tests (BearSSL)
        run: make -C test/fetch -j"$(nproc)" check

      - name: Simulator renders every screen
        run: |
          make -C sim -j"$(nproc)"
          sim/build/fs_sim --out sim/shots
          sim/build/fs_sim --landscape --out sim/shots
          sim/build/fs_sim --small --out sim/shots
          sim/build/fs_sim --small --landscape --out sim/shots
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          import glob
          from PIL import Image
          for f in glob.glob("sim/shots/*.ppm"):
              Image.open(f).save(f[:-4] + ".png")
          EOF

      - name: Package firmware for the installer
        run: python3 tools/package_firmware.py ../installer/firmware

      - name: Build the display test image
        run: |
          pio run -e cyd-display-test
          python3 tools/package_firmware.py --display-test ../display-test

      - uses: actions/upload-artifact@v4
        with:
          name: flightscnr-cyd-display-test
          path: cyd/display-test/*.bin

      - name: Build the single-file installer
        run: python3 ../installer/tools/build_standalone.py ../installer/flightscnr-cyd-installer.html

      # One HTML file with the firmware inside: download, double-click, flash.
      - uses: actions/upload-artifact@v4
        with:
          name: flightscnr-cyd-installer-single-file
          path: cyd/installer/flightscnr-cyd-installer.html

      - uses: actions/upload-artifact@v4
        with:
          name: flightscnr-cyd-firmware
          path: |
            cyd/installer/firmware/*.bin
            cyd/installer/firmware/manifest.json

      # Unzip and run `python3 -m http.server 8080` inside it, then open
      # http://localhost:8080 in Chrome/Edge to flash from your own machine.
      - uses: actions/upload-artifact@v4
        with:
          name: flightscnr-cyd-installer
          path: |
            cyd/installer
            !cyd/installer/tools
            !cyd/installer/flightscnr-cyd-installer.html

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: cyd/firmware/sim/shots/*.png

      - name: Upload installer site
        if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.CYD_PAGES == 'on')
        uses: actions/upload-pages-artifact@v3
        with:
          path: cyd/installer

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.CYD_PAGES == 'on')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
